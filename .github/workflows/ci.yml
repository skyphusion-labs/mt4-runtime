name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Build the image
        run: docker build -t mt4-runtime:ci .

      - name: Smoke test
        run: docker run --rm --entrypoint /opt/mt4-runtime/scripts/smoke.sh mt4-runtime:ci

      - name: Install the terminal
        run: docker run --rm --security-opt seccomp=seccomp/wine.json -e MT4_INSTALL_ONLY=1 mt4-runtime:ci

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Coverage
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest --cov=mt4runtime --cov-report=term-missing --cov-fail-under=100
