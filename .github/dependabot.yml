version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 26.04 does not have a WineHQ suite yet, and its apt rejects the
      # armored WineHQ key. Stay on 24.04 until both are solved.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
