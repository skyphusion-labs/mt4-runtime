name: mt4-runtime

services:
  terminal:
    build:
      context: .
    image: mt4-runtime:local
    # Docker's default profile returns ENOSYS for clone3 and blocks
    # AF_ALG. Wine treats that as a fatal socket error. seccomp/wine.json
    # is the default profile plus those two allows.
    security_opt:
      - seccomp:seccomp/wine.json
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      MT4_SETUP_URL: ${MT4_SETUP_URL:-}
      MT4_ALLOW_UNLISTED_SETUP_HOST: ${MT4_ALLOW_UNLISTED_SETUP_HOST:-0}
    volumes:
      - mt4-prefix:/home/trader/.mt4
    restart: unless-stopped

volumes:
  mt4-prefix:
